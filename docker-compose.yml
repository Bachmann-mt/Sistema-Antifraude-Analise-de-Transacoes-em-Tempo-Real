services:
  postgres:
    image: postgres:16-alpine
    container_name: antifraude-db
    environment:
      POSTGRES_DB: antifraude
      POSTGRES_USER: antifraude
      POSTGRES_PASSWORD: antifraude
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata: