services:
  postgres:
    image: postgres:16-alpine
    container_name: antifraude-db
    environment:
      POSTGRES_DB: antifraude
      POSTGRES_USER: antifraude
      POSTGRES_PASSWORD: antifraude
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U antifraude -d antifraude"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    container_name: antifraude-api
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/antifraude
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata: